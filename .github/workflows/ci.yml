name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run module tests
        run: python3 -m unittest tests.test_modules
        working-directory: linux

  windows:
    name: Windows build and report tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore cchay-optimicer-cs/cchay-optimicer-cs.sln
      - name: Verify report export without system maintenance
        run: dotnet test cchay-optimicer-cs-tests/cchay-optimicer-cs-tests.csproj --filter FullyQualifiedName~SystemReportTests --logger "trx;LogFileName=system-report.trx"
